[project]
name = "ai-trade"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "shioaji>=1.3.2,<1.7",  # <1.7：1.7.0 移除 login(fetch_contract=...) 參數，會使 bot.py 登入 TypeError
    "python-dotenv>=1.0.0",
    "pandas>=2.0.0",
    "pandas-ta>=0.3.14b",
    "yfinance>=0.2.0",
    "openai>=2.38.0",
    "feedparser>=6.0.12",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
