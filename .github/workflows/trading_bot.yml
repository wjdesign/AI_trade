name: AI Trade Bot

on:
  schedule:
    # 每週一至五 00:20 UTC = 台灣時間 08:20，提早 45 分鐘啟動
    # （GitHub Actions cron 常延遲 5~40 分鐘，加上 pip install + 登入需 ~9 分鐘
    #  提早觸發可確保 09:05 開盤前完成初始化）
    - cron: '20 0 * * 1-5'
  workflow_dispatch:
    inputs:
      reason:
        description: '手動觸發原因'
        required: false
        default: '手動測試'

jobs:
  trading-bot:
    name: 執行模擬交易機器人
    runs-on: ubuntu-latest
    timeout-minutes: 340   # 5.7 小時，從 08:20 啟動算起涵蓋至 14:00 CST
                           # （含 cron 延遲緩衝 + 收盤後 daily_summary 推播）

    steps:
      - name: Checkout 程式碼
        uses: actions/checkout@v4

      - name: 設定 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 安裝套件
        run: pip install -r requirements.txt

      - name: 驗證 Secrets 格式
        env:
          API_KEY:    ${{ secrets.API_KEY || '' }}
          SECRET_KEY: ${{ secrets.SECRET_KEY || '' }}
        run: |
          python - <<'EOF'
          import os, sys, base64, re

          def mask(s: str) -> str:
              """顯示前4後4字元，中間以*遮蔽"""
              if len(s) <= 8:
                  return "***"
              return s[:4] + "*" * (len(s) - 8) + s[-4:]

          def diagnose_secret_key(key: str) -> list[str]:
              issues = []
              raw_bytes = key.encode("utf-8")

              # 1. 長度資訊
              print(f"  字元數     : {len(key)}")
              print(f"  UTF-8 bytes: {len(raw_bytes)}")
              print(f"  內容(遮蔽) : {mask(key)}")

              # 2. 非 ASCII 字元
              non_ascii = [(i, hex(ord(c))) for i, c in enumerate(key) if ord(c) > 127]
              if non_ascii:
                  issues.append(f"含非ASCII字元：{non_ascii}")
              else:
                  print("  ASCII 檢查 : OK（無非ASCII字元）")

              # 3. 不可見字元（空白以外）
              invisible = [(i, repr(c)) for i, c in enumerate(key) if c not in (' ', '\t') and not c.isprintable()]
              if invisible:
                  issues.append(f"含不可見字元：{invisible}")
              else:
                  print("  可見字元   : OK")

              # 4. base64 資訊（僅供診斷，不阻止執行，Shioaji 內部處理格式不同）
              try:
                  decoded = base64.b64decode(key + "==")
                  print(f"  base64解碼長度 : {len(decoded)} bytes（僅供參考，不影響登入）")
              except Exception as ex:
                  issues.append(f"SECRET_KEY 不是有效的 base64 字串: {ex}")

              return issues

          errors = []
          api_key    = os.environ.get("API_KEY", "")
          secret_key = os.environ.get("SECRET_KEY", "")

          print("=" * 50)
          print("[Secrets 驗證] API_KEY")
          print(f"  字元數  : {len(api_key.strip())}")
          if not api_key.strip():
              errors.append("API_KEY 未設定")
          else:
              print(f"  內容    : {mask(api_key.strip())}")

          print("[Secrets 驗證] SECRET_KEY 詳細診斷")
          if not secret_key.strip():
              errors.append("SECRET_KEY 未設定")
          else:
              issues = diagnose_secret_key(secret_key.strip())
              errors.extend(issues)

          print("=" * 50)
          if errors:
              for e in errors:
                  print(f"[Secrets 驗證] 錯誤: {e}")
              print()
              print("解決方法：")
              print("  1. 前往永豐金 API 管理頁面重新複製 SECRET_KEY")
              print("     https://order.sinotrade.com.tw/newweb/api_token_manage/index")
              print("  2. 確認複製的是單行、無空格的完整字串")
              print("  3. 更新 GitHub Secret：")
              print("     https://github.com/你的帳號/AI_trade/settings/secrets/actions")
              sys.exit(1)

          print("[Secrets 驗證] 所有 Secrets 格式正確，繼續執行。")
          EOF

      - name: 還原 CA 憑證（.pfx）
        run: |
          echo "${{ secrets.CA_CERT_B64 }}" | base64 -d > /tmp/sinopac.pfx
          echo "CA_CERT_PATH=/tmp/sinopac.pfx" >> $GITHUB_ENV

      - name: 還原歷史交易紀錄（如有）
        # 從前次 workflow run 的 artifacts 下載 logs/，讓 bot 啟動時能讀到歷史紀錄。
        # 第一次跑或者沒有 artifacts 時不會失敗（continue-on-error）。
        uses: actions/download-artifact@v4
        with:
          pattern: trade-logs-*
          path: ./
          merge-multiple: true
          # 用 GITHUB_TOKEN 跨 workflow run 抓最近的 artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
        continue-on-error: true

      - name: 執行交易機器人
        env:
          API_KEY:              ${{ secrets.API_KEY }}
          SECRET_KEY:           ${{ secrets.SECRET_KEY }}
          CA_PASSWORD:          ${{ secrets.CA_PASSWORD }}
          OPENAI_API_KEY:       ${{ secrets.OPENAI_API_KEY }}
          TELEGRAM_BOT_TOKEN:   ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:     ${{ secrets.TELEGRAM_CHAT_ID }}
          # 交易模式控制（重要）
          #   未設定 / 設為 true → 模擬交易（不動用真實資金，安全預設）
          #   設為 false → 正式交易（動用真實資金）
          # 切換正式交易：到 Repository Settings → Secrets → 新增 SIMULATION = false
          SIMULATION:           ${{ secrets.SIMULATION || 'true' }}
          # 正式交易雙重確認（防呆）
          #   只有 SIMULATION=false 還不夠，必須同時設 CONFIRM_REAL_MONEY=I_KNOW_THIS_IS_REAL_MONEY
          #   兩者皆正確時才會真的進入正式模式，任何一項缺漏都會 fallback 到模擬
          CONFIRM_REAL_MONEY:   ${{ secrets.CONFIRM_REAL_MONEY || '' }}
          # ── 策略參數 Variables（非敏感，可在 Repo Settings → Variables tab 設定）──
          # 5 個常調參數，未設定時 bot.py 用內建預設值
          # 改值：到 GitHub → Repo Settings → Secrets and variables → Actions → Variables tab → 新增/編輯
          # 改完下次 cron 跑就用新值，不用 commit / push 任何程式碼
          MAX_POSITIONS:        ${{ vars.MAX_POSITIONS     || '' }}  # 預設 4
          TOTAL_BUDGET:         ${{ vars.TOTAL_BUDGET      || '' }}  # 預設 46000
          STOP_LOSS_PCT:        ${{ vars.STOP_LOSS_PCT     || '' }}  # 預設 0.03（3%）
          MIN_ORDER_VALUE:      ${{ vars.MIN_ORDER_VALUE   || '' }}  # 預設 11000
          SENTIMENT_ENABLED:    ${{ vars.SENTIMENT_ENABLED || '' }}  # 預設 false
          SKIP_MARKET_FILTER:   ${{ vars.SKIP_MARKET_FILTER || '' }}  # 預設 false；模擬戶測試時設 true 跳過大盤過濾
          # HTTPS_PROXY: 選填，若需要 Proxy 才能連 Telegram，請在 Secrets 加入後取消此行註解
          # HTTPS_PROXY: ${{ secrets.HTTPS_PROXY }}
        run: python bot.py

      - name: 備份本次交易紀錄
        # 不論 bot 正常結束或異常中斷，都把 logs/ 和 shioaji.log 備份成 artifact，
        # 保留 90 天，下次 workflow run 啟動時會自動下載還原。
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trade-logs-${{ github.run_id }}
          path: |
            logs/
            shioaji.log
          retention-days: 90
          if-no-files-found: warn

      - name: 清除憑證
        if: always()
        run: rm -f /tmp/sinopac.pfx
